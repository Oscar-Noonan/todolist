<h1>My Todo List</h1>

<form action="/CreateNote" method="post">
    <label for="note">Create a new listing:</label><br>
    <input type="text" id="note" name="note"><br><br>
    <input type="submit" value="Submit">
</form>

<ul>
    <li th:each="todo : ${todos}"
        th:text="${todo.note}">
    </li>
</ul>
